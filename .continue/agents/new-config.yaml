name: My Local Setup
version: 0.0.1          # or whatever is already there
schema: v1

models:
  - name: Qwen2.5 0.5B              # friendly name you see in dropdown
    provider: ollama
    model: qwen2.5:0.5b             # exact tag you pulled with ollama pull
    # apiBase: http://localhost:11434   # usually not needed (default)

  # Add better coding model if you pulled it (strongly recommended)
  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b

# Optional: fast autocomplete with a smaller model
tabAutocompleteModel:
  name: Fast Autocomplete
  provider: ollama
  model: qwen2.5-coder:1.5b        # or :0.5b if you want ultra-fast