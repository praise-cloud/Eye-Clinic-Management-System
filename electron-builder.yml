appId: com.korene.eyeclinic
productName: KORENE
copyright: Copyright © 2026 KORENE Eye Clinic

asar: false
compression: maximum
nodeGypRebuild: false
buildDependenciesFromSource: false

directories:
  output: release/KORENE_v2
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - src/services/**/*
  - src/utils/**/*
  - database.js
  - package.json
  - node_modules/**/*
  - "!node_modules/.cache/**/*"
  - "!node_modules/**/test/**/*"
  - "!node_modules/**/tests/**/*"
  - "!node_modules/**/*.md"
  - "!node_modules/**/README*"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/.git/**/*"

extraMetadata:
  main: electron/main.js
  version: 1.0.0

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/bcryptjs/**/*

win:
  target:
    - target: dir
  artifactName: KORENE-${version}.${ext}
  signAndEditExecutable: false

afterPack: ./scripts/afterPack.js
