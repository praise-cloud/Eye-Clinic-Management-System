appId: com.korene.eyeclinic.server
productName: KORENE_Server
copyright: Copyright © 2026 KORENE Eye Clinic

asar: true
compression: maximum
nodeGypRebuild: false
buildDependenciesFromSource: false

directories:
  output: release/KORENE_Server_v2
  buildResources: build

files:
  - electron/server/**/*
  - electron/server-main.js
  - database.js
  - package.json
  - scripts/start-server.js
  - node_modules/**/*
  - "!node_modules/.cache/**/*"
  - "!node_modules/**/test/**/*"
  - "!node_modules/**/tests/**/*"
  - "!node_modules/**/*.md"
  - "!node_modules/**/README*"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/.git/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/@babel/**/*"
  - "!node_modules/@testing-library/**/*"
  - "!node_modules/jest/**/*"
  - "!node_modules/vite/**/*"
  - "!node_modules/@vitejs/**/*"
  - "!node_modules/tailwindcss/**/*"
  - "!node_modules/postcss/**/*"
  - "!node_modules/autoprefixer/**/*"
  - "!node_modules/babel*/**/*"
  - "!node_modules/eslint*/**/*"
  - "!node_modules/jsdom/**/*"
  - "!node_modules/sql.js/**/*"
  - "!node_modules/puppeteer/**/*"
  - "!node_modules/puppeteer-core/**/*"

extraMetadata:
  main: electron/server-main.js
  version: 1.0.0

asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/bcryptjs/**/*

win:
  target:
    - target: dir
  artifactName: KORENE_Server-${version}.${ext}
  signAndEditExecutable: false

afterPack: ./scripts/afterPack.js
